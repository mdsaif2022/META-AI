name: META AI Bot

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches: [ main, master ]
  schedule:
    # Run every 5.5 hours to avoid hitting the 6-hour limit
    # GitHub Actions free tier limit is 6 hours per run
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max (GitHub Actions free tier limit)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' # Required by ws3-fca package (needs Node.js >=22.x)

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev

      - name: Install npm dependencies
        continue-on-error: false
        run: |
          set +e  # Don't exit on error immediately
          
          # Install dependencies - canvas may fail to build with Node.js 22.x
          echo "Installing npm dependencies..."
          npm install --legacy-peer-deps
          NPM_EXIT=$?
          
          # Check if critical dependencies are installed
          if [ ! -d "node_modules/axios" ] || [ ! -d "node_modules/ws3-fca" ]; then
            echo "Critical dependencies missing, trying to install them..."
            npm install axios ws3-fca express --legacy-peer-deps --save
          fi
          
          # Remove canvas if it failed (it's not critical for bot operation)
          if [ ! -d "node_modules/canvas" ] || [ ! -f "node_modules/canvas/build/Release/canvas.node" ]; then
            echo "⚠️ Canvas package unavailable (expected with Node.js 22.x)"
            echo "Bot will still work - canvas is only needed for rank/weather commands"
            rm -rf node_modules/canvas 2>/dev/null || true
          fi
          
          # Verify core dependencies
          set -e  # Exit on error for this check
          if [ ! -d "node_modules/axios" ] || [ ! -d "node_modules/ws3-fca" ]; then
            echo "❌ ERROR: Critical dependencies are missing!"
            exit 1
          fi
          
          echo "✅ Core dependencies installed successfully"
          exit 0

      - name: Create account.txt from secret
        run: |
          if [ -n "${{ secrets.APPSTATE }}" ]; then
            echo "${{ secrets.APPSTATE }}" > account.txt
            echo "account.txt created from APPSTATE secret"
          elif [ -n "${{ secrets.ACCOUNT_TXT }}" ]; then
            echo "${{ secrets.ACCOUNT_TXT }}" > account.txt
            echo "account.txt created from ACCOUNT_TXT secret"
          else
            echo "Warning: Neither APPSTATE nor ACCOUNT_TXT secret is set."
            echo "Bot will try to login with email/password from config.json if available."
            echo "For best results, set APPSTATE secret with your appState JSON array."
          fi

      - name: Setup config.json
        run: |
          # When NODE_ENV=production, bot looks for config.dev.json
          # Create it from config.json if it doesn't exist
          if [ ! -f "config.dev.json" ]; then
            cp config.json config.dev.json
            echo "Created config.dev.json from config.json"
          fi
          if [ ! -f "configCommands.dev.json" ]; then
            cp configCommands.json configCommands.dev.json
            echo "Created configCommands.dev.json from configCommands.json"
          fi
          echo "Config files are ready"

      - name: Run META AI Bot
        env:
          NODE_ENV: production
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Starting META AI Bot..."
          npm start
        continue-on-error: true # Continue even if bot crashes to see logs

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: |
            *.log
            logs/
          retention-days: 7

